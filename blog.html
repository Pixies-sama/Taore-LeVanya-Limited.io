    <script>
      (function () {
        const DATA_URL = "../data/blog-data.json";
        const grid = document.getElementById("blog-grid");
        const searchInput = document.getElementById("search-input");
        const pills = document.querySelectorAll(".filter-pill");
        const resultsMeta = document.getElementById("results-meta");

        let allPosts = [];
        let activeCategory = "All";
        let searchTerm = "";

        // Strip HTML tags so search can match against the article body too.
        function stripHtml(html) {
          const tmp = document.createElement("div");
          tmp.innerHTML = html;
          return tmp.textContent || tmp.innerText || "";
        }

        function categoryClass(category) {
          return "cat-" + category.toLowerCase();
        }

        function formatDate(iso) {
          const d = new Date(iso + "T00:00:00");
          return d.toLocaleDateString("en-US", {
            month: "short",
            day: "numeric",
            year: "numeric",
          });
        }

        function renderCard(post) {
          return `
      <a href="post.html?slug=${encodeURIComponent(post.slug)}" class="post-card reveal in">
        <div class="post-card-thumb">
          <img src="${post.image}" alt="${escapeAttr(post.title)}" loading="lazy">
        </div>
        <div class="post-card-body">
          <span class="cat-badge ${categoryClass(post.category)}">${post.category}</span>
          <h3 class="post-card-title">${escapeHtml(post.title)}</h3>
          <p class="post-card-excerpt">${escapeHtml(post.excerpt)}</p>
          <div class="post-card-meta">
            <span>${formatDate(post.date)}</span>
            <span>${post.readTime}</span>
          </div>
        </div>
      </a>
    `;
        }

        function escapeHtml(str) {
          const div = document.createElement("div");
          div.textContent = str;
          return div.innerHTML;
        }
        function escapeAttr(str) {
          return String(str).replace(/"/g, "&quot;");
        }

        function applyFilters() {
          let posts = allPosts.slice();

          if (activeCategory !== "All") {
            posts = posts.filter((p) => p.category === activeCategory);
          }

          if (searchTerm.trim()) {
            const term = searchTerm.trim().toLowerCase();
            posts = posts.filter((p) => {
              const haystack = (
                p.title +
                " " +
                p.category +
                " " +
                p.excerpt +
                " " +
                stripHtml(p.content)
              ).toLowerCase();
              return haystack.includes(term);
            });
          }

          // Newest first
          posts.sort((a, b) => new Date(b.date) - new Date(a.date));

          render(posts);
        }

        function render(posts) {
          if (!posts.length) {
            grid.innerHTML = `
        <div class="blog-empty" style="grid-column:1/-1;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <h3>No articles found</h3>
          <p>Try a different search term or category.</p>
          <button id="reset-filters">Reset filters</button>
        </div>`;
            document
              .getElementById("reset-filters")
              .addEventListener("click", () => {
                searchInput.value = "";
                searchTerm = "";
                activeCategory = "All";
                pills.forEach((p) =>
                  p.classList.toggle("active", p.dataset.category === "All"),
                );
                applyFilters();
              });
          } else {
            grid.innerHTML = posts.map(renderCard).join("");
          }
          resultsMeta.textContent = `${posts.length} article${posts.length === 1 ? "" : "s"}`;
        }

        pills.forEach((pill) => {
          pill.addEventListener("click", () => {
            pills.forEach((p) => p.classList.remove("active"));
            pill.classList.add("active");
            activeCategory = pill.dataset.category;
            applyFilters();
          });
        });

        let debounceTimer;
        searchInput.addEventListener("input", (e) => {
          clearTimeout(debounceTimer);
          debounceTimer = setTimeout(() => {
            searchTerm = e.target.value;
            applyFilters();
          }, 150);
        });

        fetch(DATA_URL)
          .then((res) => {
            if (!res.ok)
              throw new Error(
                "Failed to load blog-data.json (" + res.status + ")",
              );
            return res.json();
          })
          .then((data) => {
            allPosts = data.posts || [];
            applyFilters();
          })
          .catch((err) => {
            grid.innerHTML = `
        <div class="blog-empty" style="grid-column:1/-1;">
          <h3>Couldn't load articles</h3>
          <p>${escapeHtml(err.message)}. If you're opening this file directly from your computer, run it through a local server instead (see README).</p>
        </div>`;
            console.error(err);
          });
      })();
    </script>
